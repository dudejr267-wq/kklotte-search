<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>경기롯데 상품 검색</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; background: #fff; color: #1a1a1a; }

    #main-page, #search-page { width: 100%; }
    #search-page { display: none; }

    .main-wrap {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; min-height: 100vh; padding: 3rem 1rem;
    }
    .logo-area { text-align: center; margin-bottom: 2.5rem; }
    .logo-kr { font-size: 13px; color: #888; letter-spacing: 0.15em; margin-bottom: 6px; }
    .logo-main { font-size: 52px; font-weight: 600; color: #1a1a1a; letter-spacing: -2px; line-height: 1; }
    .logo-main span { color: #D85A30; }
    .logo-sub { font-size: 13px; color: #aaa; margin-top: 10px; letter-spacing: 0.05em; }

    .search-box-wrap { width: 100%; max-width: 580px; position: relative; }
    .search-input {
      width: 100%; height: 54px; border: 1.5px solid #ddd;
      border-radius: 27px; padding: 0 56px 0 24px; font-size: 16px;
      background: #fff; color: #1a1a1a; outline: none; transition: border-color 0.15s;
    }
    .search-input:focus { border-color: #D85A30; box-shadow: 0 0 0 3px rgba(216,90,48,0.08); }
    .search-btn {
      position: absolute; right: 9px; top: 50%; transform: translateY(-50%);
      width: 38px; height: 38px; border-radius: 50%; background: #D85A30;
      border: none; cursor: pointer; display: flex; align-items: center; justify-content: center;
    }
    .search-btn:hover { background: #C04E28; }
    .search-btn svg { width: 17px; height: 17px; fill: #fff; }

    .quick-tags { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-top: 1.5rem; max-width: 580px; }
    .tag {
      font-size: 13px; padding: 6px 14px; border-radius: 20px;
      border: 1px solid #e0e0e0; color: #555; cursor: pointer;
      background: #fff; transition: all 0.15s;
    }
    .tag:hover { border-color: #D85A30; color: #D85A30; background: #fff5f2; }

    .brand-row {
      display: flex; gap: 8px; flex-wrap: wrap; justify-content: center;
      margin-top: 2.5rem; max-width: 580px;
    }
    .brand-pill {
      font-size: 11px; padding: 4px 11px; border-radius: 12px;
      background: #f5f5f5; color: #999; border: 1px solid #eee;
    }

    .search-header {
      display: flex; align-items: center; gap: 12px;
      padding: 12px 20px; border-bottom: 1px solid #eee;
      position: sticky; top: 0; background: #fff; z-index: 10;
    }
    .back-btn {
      font-size: 13px; color: #555; cursor: pointer;
      padding: 6px 12px; border-radius: 8px;
      border: 1px solid #e0e0e0; background: #fff; white-space: nowrap;
    }
    .back-btn:hover { background: #f5f5f5; }
    .header-logo { font-size: 20px; font-weight: 600; color: #1a1a1a; white-space: nowrap; }
    .header-logo span { color: #D85A30; }
    .search-input-sm {
      flex: 1; height: 38px; border: 1px solid #ddd;
      border-radius: 19px; padding: 0 42px 0 16px; font-size: 14px;
      background: #fff; color: #1a1a1a; outline: none; max-width: 440px;
    }
    .search-input-sm:focus { border-color: #D85A30; }
    .search-btn-sm {
      width: 30px; height: 30px; border-radius: 50%; background: #D85A30;
      border: none; cursor: pointer; display: flex; align-items: center; justify-content: center;
      margin-left: -40px; flex-shrink: 0;
    }
    .search-btn-sm svg { width: 13px; height: 13px; fill: #fff; }

    .result-meta {
      padding: 10px 20px; font-size: 13px; color: #999;
      border-bottom: 1px solid #f0f0f0;
    }
    .result-keyword { color: #D85A30; font-weight: 600; }

    .filter-row {
      display: flex; gap: 8px; padding: 10px 20px;
      border-bottom: 1px solid #f0f0f0; flex-wrap: wrap;
    }
    .filter-btn {
      font-size: 12px; padding: 5px 12px; border-radius: 14px;
      border: 1px solid #e0e0e0; color: #666; background: #fff; cursor: pointer;
      transition: all 0.15s;
    }
    .filter-btn:hover { border-color: #D85A30; color: #D85A30; }
    .filter-btn.active { background: #D85A30; color: #fff; border-color: #D85A30; }

    .product-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
      gap: 14px; padding: 16px 20px;
    }
    .product-card {
      border: 1px solid #eee; border-radius: 12px;
      background: #fff; overflow: hidden;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .product-card:hover { border-color: #D85A30; box-shadow: 0 2px 12px rgba(216,90,48,0.1); }
    .product-img {
      width: 100%; height: 130px; background: #f9f9f9;
      display: flex; align-items: center; justify-content: center;
      position: relative;
    }
    .product-img-inner { font-size: 48px; }
    .product-photo { width: 100%; height: 100%; object-fit: cover; display: block; }
    .brand-badge {
      position: absolute; top: 8px; left: 8px;
      font-size: 10px; padding: 3px 8px; border-radius: 8px; font-weight: 600;
    }
    .new-badge {
      position: absolute; top: 8px; right: 8px;
      font-size: 10px; padding: 3px 7px; border-radius: 8px; font-weight: 700;
      background: #ff4757; color: #fff;
    }
    .sale-badge {
      position: absolute; top: 8px; right: 8px;
      font-size: 10px; padding: 3px 7px; border-radius: 8px; font-weight: 700;
      background: #2ed573; color: #fff;
    }
    .product-body { padding: 10px 13px 13px; }
    .product-name { font-size: 13px; font-weight: 600; color: #1a1a1a; line-height: 1.4; }
    .product-brand { font-size: 11px; color: #aaa; margin-top: 3px; }
    .product-price { font-size: 14px; font-weight: 700; color: #D85A30; margin-top: 7px; }
    .product-kgprice { font-size: 11px; color: #888; font-weight: 600; margin-top: 2px; }
    .product-kgprice b { color: #D85A30; font-weight: 700; }
    .product-unit { font-size: 11px; color: #aaa; font-weight: 400; }
    .product-unit-info { font-size: 11px; color: #aaa; margin-top: 3px; line-height: 1.4; }
    .product-tags { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 7px; }
    .ptag { font-size: 10px; padding: 2px 7px; border-radius: 6px; font-weight: 500; }
    .empty { grid-column: 1/-1; text-align: center; padding: 3rem; color: #bbb; font-size: 15px; }

    .sort-row {
      display: flex; align-items: center; justify-content: flex-end;
      padding: 8px 20px; border-bottom: 1px solid #f0f0f0; gap: 8px;
    }
    .sort-label { font-size: 12px; color: #aaa; }
    .sort-select {
      height: 32px; padding: 0 28px 0 12px; font-size: 12px;
      border: 1.5px solid #D85A30; border-radius: 16px;
      color: #D85A30; font-weight: 600; background: #fff;
      cursor: pointer; outline: none;
      appearance: none; -webkit-appearance: none;

      background-repeat: no-repeat; background-position: right 10px center;
      transition: all 0.15s;
    }
    .sort-select:focus { box-shadow: 0 0 0 3px rgba(216,90,48,0.1); }

    /* 이미지 팝업 */
    .img-overlay {

      background: rgba(0,0,0,0.82); z-index: 1000;
      align-items: center; justify-content: center;
    }
    .img-overlay.active { display: flex; }
    .img-popup {
      position: relative; max-width: 92vw; max-height: 92vh;
      border-radius: 14px; overflow: hidden;
      box-shadow: 0 8px 40px rgba(0,0,0,0.5); background: #fff;

    .img-popup img {
      display: block; max-width: 88vw; max-height: 84vh; object-fit: contain;

    .img-popup-close {
      position: absolute; top: 10px; right: 12px;
      width: 32px; height: 32px; border-radius: 50%;
      background: rgba(0,0,0,0.55); border: none; cursor: pointer;
      color: #fff; font-size: 18px; line-height: 32px; text-align: center;
      font-weight: 700; z-index: 10;

    .img-popup-close:hover { background: #D85A30; }
    .img-popup-label {
      position: absolute; bottom: 0; left: 0; right: 0;
      background: rgba(0,0,0,0.55); color: #fff;
      font-size: 13px; padding: 8px 14px; text-align: center;
    }
    .view-img-hint {
      position: absolute; bottom: 0; left: 0; right: 0;
      background: rgba(216,90,48,0.88); color: #fff;
      font-size: 11px; font-weight: 700; text-align: center;
      padding: 5px 0; opacity: 0; transition: opacity 0.18s;
      letter-spacing: 0.05em; pointer-events: none;
    }
    .has-img { cursor: pointer; }
    .has-img:hover { border-color: #D85A30; box-shadow: 0 2px 14px rgba(216,90,48,0.18); }
    .has-img:hover .view-img-hint { opacity: 1; }

    .contact-btn {

      background: #fafafa; font-size: 12px; font-weight: 600; color: #555;

    }
    .contact-btn:hover { background: #fff3ef; border-color: #D85A30; color: #D85A30; }

    /* ── 담당자 팝업 ── */

function parsePrice(str) {
  return parseInt((str || '0').replace(/,/g, ''), 10);
}

// unit 문자열에서 kg당 단가 추출
function extractKgPrice(unit, price) {
  if (!unit) return null;
  // "kg당 7,065" / "kg 7,065" / "kg단가 7,065" 패턴
  let m = unit.match(/kg\s*(?:당|단가)?\s*([\d,]+)\s*(?:원)?/i);
  if (m) return m[1];
  // unit에 "kg" 자체가 단위로 들어가있고 (예: "1kg", "2kg") kg단가 별도 없음
  // 이 경우 봉단가/kg = kg단가 가능 (1kg면 동일)
  const m2 = unit.match(/^([\d.]+)\s*(?:k|K)g/);
  if (m2) {
    const kg = parseFloat(m2[1]);
    if (kg > 0 && price) {
      const p = parsePrice(price);
      if (p > 0) return Math.round(p / kg).toLocaleString();
    }
  }
  // 그램 단위 (예: 500g, 800g)
  const m3 = unit.match(/^([\d,]+)\s*g/i);
  if (m3) {
    const g = parseInt(m3[1].replace(/,/g, ''), 10);
    if (g > 0 && price) {
      const p = parsePrice(price);
      if (p > 0) return Math.round(p * 1000 / g).toLocaleString();
    }
  }
  return null;
}

// unit 문자열에서 "kg당 X" 같은 단가 정보 제거하여 깔끔하게
function cleanUnit(unit) {
  if (!unit) return '';
  return unit
    .replace(/,?\s*kg\s*(?:당|단가)?\s*[\d,]+\s*(?:원)?/gi, '')
    .replace(/,?\s*봉\s*[\d,]+\s*(?:원)?/gi, '')
    .replace(/,?\s*\d+%\s*할인/g, '')
    .replace(/\s*\(\s*\)\s*/g, '')
    .replace(/,\s*,/g, ',')
    .replace(/\(\s*,/g, '(')
    .replace(/,\s*\)/g, ')')
    .trim().replace(/^,|,$/g, '').trim();
}

function doSearch(kw) {
  currentKeyword = kw || document.getElementById('main-input').value.trim();
  if (!currentKeyword) return;
  document.getElementById('header-input').value = currentKeyword;
  document.getElementById('main-page').style.display = 'none';
  document.getElementById('search-page').style.display = 'block';
  currentFilter = '전체';
  currentSort = 'default';
  document.getElementById('sort-select').value = 'default';
  renderResults();
}

function goMain() {
  document.getElementById('main-page').style.display = 'block';
  document.getElementById('search-page').style.display = 'none';
  document.getElementById('main-input').value = '';
  currentFilter = '전체';
  currentSort = 'default';
}

function setSortAndRender() {
  currentSort = document.getElementById('sort-select').value;
  renderResults();
}

function renderResults() {
  const kw = currentKeyword;
  let filtered = PRODUCTS.filter(p =>
    p.name.includes(kw) ||
    p.category.includes(kw) ||
    p.brand.includes(kw) ||
    p.tags.some(t => t.includes(kw)) ||
    (p.keywords && p.keywords.includes(kw))
  );

  document.getElementById('result-meta').innerHTML =
    `<span class="result-keyword">"${kw}"</span> 검색결과 · 총 ${filtered.length}개 제품 (냠냐미·안심찬·올바른·아워밀·설빙 외 2026년 5~8월 기준)`;

  const cats = ['전체', ...new Set(filtered.map(p => p.category))];
  document.getElementById('filter-row').innerHTML = cats.map(c =>
    `<button class="filter-btn ${currentFilter === c ? 'active' : ''}" onclick="setFilter('${c}')">${c}</button>`
  ).join('');

  if (currentFilter !== '전체') filtered = filtered.filter(p => p.category === currentFilter);

  if (currentSort === 'price-asc') {
    filtered = [...filtered].sort((a, b) => parsePrice(a.price) - parsePrice(b.price));
  } else if (currentSort === 'price-desc') {
    filtered = [...filtered].sort((a, b) => parsePrice(b.price) - parsePrice(a.price));
  } else if (currentSort === 'name-asc') {
    filtered = [...filtered].sort((a, b) => a.name.localeCompare(b.name, 'ko'));
  }

  if (filtered.length === 0) {
    document.getElementById('product-grid').innerHTML = `<div class="empty">검색된 제품이 없습니다.<br><span style="font-size:12px;color:#ccc;margin-top:8px;display:block;">다른 검색어로 시도해보세요</span></div>`;
    return;
  }

  const grid = document.getElementById('product-grid');
  grid.innerHTML = '';
  filtered.map(p => {
    const imgPath = IMG_MAP[p.id];
    const hasImg = !!imgPath;
    const card = document.createElement('div');
    card.className = 'product-card' + (hasImg ? ' has-img' : '');
    if (hasImg) {
      card.dataset.img = imgPath;
      card.dataset.name = p.name;
      card.addEventListener('click', function() { showPage(this.dataset.img, this.dataset.name); });
    }
    const hasPhoto = PHOTO_IDS.has(p.id);
    card.innerHTML = `
      <div class="product-img" style="background:${p.color}22">
        ${hasPhoto
          ? `<img class="product-photo" src="products_clean/${p.id}.jpg" alt="${p.name}" loading="lazy" onerror="this.outerHTML='<span class=\\'product-img-inner\\'>${p.emoji}</span>'">`
          : hasImg
            ? `<img class="product-photo" src="${imgPath}" alt="${p.name}" loading="lazy" onerror="this.outerHTML='<span class=\\'product-img-inner\\'>${p.emoji}</span>'">`
            : `<span class="product-img-inner">${p.emoji}</span>`}
        <span class="brand-badge" style="background:${p.color};color:${p.tcolor}">${p.brand}</span>
        ${p.isNew ? '<span class="new-badge">NEW</span>' : ''}
        ${p.isSale && !p.isNew ? '<span class="sale-badge">SALE</span>' : ''}
        ${hasImg ? '<span class="view-img-hint">🔍 행사지 보기</span>' : ''}
      </div>
      <div class="product-body">
        <div class="product-name">${p.name}</div>
        <div class="product-brand">${p.category}</div>
        <div class="product-price">${p.price}원 <span class="product-unit">/ ${p.unit}</span></div>
        <div class="product-tags">
          ${p.tags.map(t => `<span class="ptag" style="background:${p.color};color:${p.tcolor}">${t}</span>`).join('')}
        </div>
        ${CONTACTS[p.brand] ? `<button class="contact-btn" onclick="event.stopPropagation();showContact('${p.brand}')">📞 담당자 문의</button>` : ''}
      </div>`;
    return card;
  }).forEach(el => grid.appendChild(el));
}

function setFilter(c) {
  currentFilter = c;
  renderResults();
}

function showPage(path, name) {
  const encoded = path.split('/').map(function(s){ return encodeURIComponent(s); }).join('/');
  const img = document.getElementById('img-popup-img');
  img.src = encoded;
  img.onerror = function() {
    img.onerror = null;
    img.src = path;
  };
  document.getElementById('img-popup-label').textContent = name;
  document.getElementById('img-overlay').classList.add('active');
  document.body.style.overflow = 'hidden';
}

function closeImgPopup(e) {
  const overlay = document.getElementById('img-overlay');
  if (e && e.target !== overlay && !e.target.classList.contains('img-popup-close')) return;
  overlay.classList.remove('active');
  document.getElementById('img-popup-img').src = '';
  document.body.style.overflow = '';
}

function showContact(brand) {
  const c = CONTACTS[brand];
  if (!c) return;
  const photoHtml = c.photo
    ? `<img src="${c.photo}" alt="${c.name}">`
    : `<span class="contact-photo-placeholder">👤</span>`;
  document.getElementById('contact-photo-wrap').innerHTML = photoHtml;
  document.getElementById('contact-name').textContent = c.name;
  document.getElementById('contact-role').textContent = brand + ' 담당';
  document.getElementById('contact-tel').textContent = c.tel;
  document.getElementById('contact-call-btn').href = 'tel:' + c.tel.replace(/-/g, '');
  document.getElementById('contact-overlay').classList.add('active');
  document.body.style.overflow = 'hidden';
}

function closeContactPopup(e) {
  const overlay = document.getElementById('contact-overlay');
  if (e && e.target !== overlay && !e.target.classList.contains('contact-close')) return;
  overlay.classList.remove('active');
  document.body.style.overflow = '';
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    document.getElementById('img-overlay').classList.remove('active');
    document.getElementById('contact-overlay').classList.remove('active');
    document.body.style.overflow = '';
  }
});
