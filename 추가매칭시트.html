.candidates { flex: 1; display: flex; gap: 8px; flex-wrap: wrap; align-items: flex-start; }

: "26,400", "unit": "4.56Kg(190ml×24ea)", "page_key": "AW_15", "page_num": 15, "page_brand": "AW", "candidates": []}];
const BRAND_DIR = {"AW": "images/아워밀(설빙)/아워밀 6~8월 행사지all/", "NY": "images/냠냐미/(수도권&경기)26년5~6월냠냐미POP_compressed (1)/", "AS": "images/안심찬/안심찬 26년 6월 신제품 및 추가홍보POP(수도권)/", "OB": "images/올바른/올바른 26년도 6월 홍보지 출력용_compressed/"};

let choices = JSON.parse(localStorage.getItem('match_choices') || '{}'); // {pid: 'cand_filename' | 'skip'}
let mode = 'all';

function save() { localStorage.setItem('match_choices', JSON.stringify(choices)); }

function setMode(m) {
  mode = m;
  document.querySelectorAll('.btn').forEach(b => b.classList.toggle('active', b.dataset.mode === m));
  render();
}

function render() {
  const root = document.getElementById('rows');
  let list = DATA.slice();
  if (mode === 'todo') list = list.filter(d => !choices[d.pid]);
  else if (mode === 'done') list = list.filter(d => choices[d.pid] && choices[d.pid] !== 'skip');
  else if (mode === 'nocand') list = list.filter(d => d.candidates.length === 0);
  
  root.innerHTML = '';
  list.forEach(d => {
    const choice = choices[d.pid];
    const row = document.createElement('div');
    row.className = 'row' + (choice === 'skip' ? ' skipped' : choice ? ' matched' : '');
    
    const pageHref = BRAND_DIR[d.page_brand] + 'page_' + String(d.page_num).padStart(2,'0') + '.jpg';
    
    // 왼쪽: 제품 정보 + 선택된 사진 미리보기
    let preview;
    if (choice && choice !== 'skip') {
      preview = `<div class="selected-preview"><img src="candidates/${choice}" alt=""></div>`;
    } else if (choice === 'skip') {
      preview = `<div class="placeholder" style="background:#cbd5e1;color:#fff;font-size:14px;font-weight:600;">사진 없음</div>`;
    } else {
      preview = `<div class="placeholder">${d.emoji}</div>`;
    }
    
    let candHtml;
    if (d.candidates.length === 0) {
      candHtml = `<div class="no-cand">이 페이지엔 사진 후보가 없어요. <a href="${pageHref}" target="_blank" class="page-link">페이지 직접 보기 →</a></div>`;
    } else {
      candHtml = d.candidates.map((c, i) =>
        `<div class="cand ${choice === c.file ? 'selected' : ''}" data-pid="${d.pid}" data-file="${c.file}">
          <img src="candidates/${c.file}" alt="">
          <div class="label">#${i+1} (${c.w}×${c.h})</div>
        </div>`
      ).join('');
    }
    
    row.innerHTML = `
      <div class="product-info">
        <div class="pid">#${d.pid}</div>
        <div class="pname">${d.name}</div>
        <div class="brand">${d.brand}</div>
        <div class="meta">${d.price}원 / ${d.unit}</div>
        <div class="meta">📄 page_${String(d.page_num).padStart(2,'0')} <a href="${pageHref}" target="_blank" class="page-link">페이지 보기 →</a></div>
        ${preview}
      </div>
      <div class="candidates">${candHtml}</div>
      <button class="skip-btn ${choice === 'skip' ? 'active' : ''}" data-pid="${d.pid}">사진 없음</button>
    `;
    
    row.querySelectorAll('.cand').forEach(el => {
      el.onclick = () => {
        const pid = +el.dataset.pid;
        const file = el.dataset.file;
        if (choices[pid] === file) delete choices[pid]; // 다시 클릭하면 해제
        else choices[pid] = file;
        save(); render(); updateBar();
      };
    });
    row.querySelector('.skip-btn').onclick = () => {
      const pid = d.pid;
      if (choices[pid] === 'skip') delete choices[pid];
      else choices[pid] = 'skip';
      save(); render(); updateBar();
    };
    
    root.appendChild(row);
  });
}

function updateBar() {
  const done = Object.entries(choices).filter(([k,v]) => v && v !== 'skip').length;
  const skip = Object.values(choices).filter(v => v === 'skip').length;
  const todo = DATA.length - done - skip;
  document.getElementById('done-count').textContent = done;
  document.getElementById('todo-count').textContent = todo;
  document.getElementById('stats').innerHTML =
    `매칭 필요 <span>${DATA.length}</span>개 · 매칭됨 <span>${done}</span> · 사진없음 표시 <span>${skip}</span> · 미처리 <span>${todo}</span>`;
}

function copyResult() {
  const out = {};
  for (const [pid, val] of Object.entries(choices)) {
    if (val !== 'skip') out[pid] = val;
  }
  const txt = JSON.stringify(out, null, 2);
  navigator.clipboard.writeText(txt).then(() => {
    const t = document.getElementById('toast');
    t.classList.add('show'); setTimeout(()=>t.classList.remove('show'), 1800);
  }).catch(() => {
    alert('복사 안 됐어요. 아래 텍스트를 직접 복사해주세요:\n\n' + txt);
  });
  console.log('매칭 결과:', txt);
}

render();
updateBar();
</script>
