name: 급식사진 주간 업데이트

on:
  schedule:
    - cron: '0 15 * * 0'  # 매주 월요일 00:00 KST (일요일 UTC 15:00)
  workflow_dispatch:       # 수동 실행 가능

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 패키지 설치
        run: pip install requests

      - name: 경기도 급식사진 학교 전수조사
        run: python school_photo_finder.py

      - name: 급식사진 스크래핑
        run: python school_meal_scraper.py

      - name: standalone HTML 빌드
        run: python build_viewer.py

      - name: 변경사항 커밋 & 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add school_photos_all.csv school_photos_top100.csv school_meal_photos.json school_photo_viewer_standalone.html
          git diff --staged --quiet || git commit -m "chore: 급식사진 주간 자동 업데이트 $(date '+%Y-%m-%d')"
          git push
